<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Unmapped: the orchard</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #2b2418; --paper: #fbf3df; --gold: #f4c25b; --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #8bbd4c; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font: 600 18px/1.35 var(--font); color: var(--ink); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }

  /* what is said, shown as it is said; the look follows who says it */
  #say { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -12px); opacity: 0; max-width: min(64vw, 520px); width: max-content; box-sizing: border-box; background: var(--paper); color: var(--ink); padding: 9px 16px; border-radius: 16px; box-shadow: 0 6px 20px rgba(60, 40, 10, .3); text-align: center; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 6; }
  #say.on { opacity: 1; transform: translate(-50%, 0); }
  #say.narrator { background: #2b2418; color: #ffe6a8; font-style: italic; }
  #say.ambrose { background: #e6efcf; color: #2f3d1c; }
  #say b { margin-right: 0.4em; }

  /* the four walking buttons, a cross at the bottom left */
  #pad { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: 164px; height: 164px; z-index: 5; display: none; }
  #pad.on { display: block; }
  #pad button { position: absolute; width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 0; background: rgba(43, 36, 24, .34); color: #fffaf0; font-size: 22px; -webkit-user-select: none; user-select: none; touch-action: none; }
  #pad button:active { background: rgba(43, 36, 24, .55); }
  #up { left: 56px; top: 0; } #left { left: 0; top: 56px; } #right { left: 112px; top: 56px; } #down { left: 56px; top: 112px; }

  /* the one action button, shown only when there is something to do */
  #act { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); min-width: 64px; height: 64px; padding: 0 22px; border-radius: 32px; border: 0; background: var(--gold); color: #2a1d05; font: 800 19px var(--font); box-shadow: 0 0 24px rgba(255, 210, 130, .7); z-index: 5; opacity: 0; pointer-events: none; transform: scale(.8); transition: .2s; }
  #act.on { opacity: 1; pointer-events: auto; transform: none; }
  #act svg { display: none; width: 34px; height: 34px; fill: none; stroke: #2a1d05; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  #act[data-face="hand"] .hand, #act[data-face="drop"] .drop, #act[data-face="ask"] .ask { display: block; }

  /* above the first-tap card and the card for messages, so Stop can be pressed on every screen from the first one */
  #stop { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); min-height: 40px; padding: 7px 14px; border-radius: 999px; border: 0; background: rgba(251, 243, 223, .94); color: var(--ink); font: 700 15px var(--font); box-shadow: 0 3px 12px rgba(60, 40, 10, .25); z-index: 45; }

  /* Next over the picture, and the end card */
  #card { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: rgba(43, 30, 12, .55); color: #fffaf0; text-align: center; font: 700 24px/1.4 var(--font); }
  #card p { margin: 0; max-width: 70vw; }
  #card button { min-height: 52px; padding: 0 26px; border-radius: 26px; border: 0; background: var(--gold); color: #2a1d05; font: 800 20px var(--font); }
  /* Next over the lantern picture: the picture shows through, and the button sits low */
  #card.over { justify-content: flex-end; background: transparent; padding-bottom: max(18px, env(safe-area-inset-bottom)); }

  /* the first tap: it also lets the phone play sound */
  #start { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; width: 100%; border: 0; padding: 0; background: radial-gradient(circle at 50% 55%, rgba(255, 226, 150, .35), rgba(60, 38, 8, .55)); color: #fffaf0; font: 800 34px var(--font); text-shadow: 0 2px 14px rgba(40, 24, 4, .6); cursor: pointer; }
  #start span { padding: 14px 34px; border-radius: 40px; background: rgba(43, 30, 12, .5); animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); } }

  #turn { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #3b2f1c; color: #fffaf0; font: 700 22px var(--font); text-align: center; padding: 30px; z-index: 50; }
  #turn .phone { font-size: 64px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 50% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 600px) { #turn { display: flex; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="say" aria-live="polite"></div>
<div id="pad">
  <button id="up" type="button" aria-label="walk up">▲</button>
  <button id="left" type="button" aria-label="walk left">◀</button>
  <button id="right" type="button" aria-label="walk right">▶</button>
  <button id="down" type="button" aria-label="walk down">▼</button>
</div>
<button id="act" type="button" data-face="hand" aria-label="do this">
  <svg class="hand" viewBox="0 0 32 32"><path d="M9 17V8a2 2 0 0 1 4 0v7M13 15V5a2 2 0 0 1 4 0v10M17 15V7a2 2 0 0 1 4 0v9M21 16v-4a2 2 0 0 1 4 0v8c0 5-3 8-8 8h-2c-4 0-6-2-8-6l-3-6a2 2 0 0 1 3-2l2 3"/></svg>
  <svg class="drop" viewBox="0 0 32 32"><path d="M16 4v14M10 12l6 6 6-6M6 25h20"/></svg>
  <svg class="ask" viewBox="0 0 32 32"><path d="M6 7h20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H15l-6 5v-5H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg>
</button>
<button id="stop" type="button" hidden>Stop here for today</button>
<div id="card" hidden></div>
<div id="turn"><div class="phone">📱</div>Turn your phone sideways to play</div>
<button id="start" type="button" hidden><span>Tap to begin</span></button>
<script src="vendor/phaser-4.2.1.min.js"></script>
<script type="module" src="world/orchard-main.js"></script>
</body>
</html>
